name: Deploy

# Runs only after CI has passed on main, so a red build never reaches the box.
# The deployment lives at /root/eavi1-app and keeps its own .env; this workflow
# moves that working copy to the exact commit CI validated, pulls the images CI
# already built and published, and restarts the stack. No images are built on the
# VPS: that step was slow and could hang, leaving the site down on cancellation.
# GHCR stays private: this job logs in with its own short-lived GITHUB_TOKEN,
# which has packages:read for this repo. No public package and no stored PAT.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (defaults to origin/main)
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /root/eavi1-app
  PUBLIC_HOST: eavi.college.eavi.shop
  # No local image names here on purpose: if these are unset the pull step fails
  # loudly rather than silently building stale images on the box.
  APP_IMAGE: ghcr.io/${{ github.repository }}:pending
  MIGRATE_IMAGE: ghcr.io/${{ github.repository }}:migrate-pending

jobs:
  deploy:
    name: Pull published images and restart on the VPS
    runs-on: [self-hosted, eavi-vps]
    # A pull should finish in well under a minute; the short timeout still fails
    # loudly if the registry hangs instead of leaving the site half-restarted.
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve target commit
        id: target
        run: |
          if [ -n "${{ github.event.inputs.sha }}" ]; then
            echo "sha=${{ github.event.inputs.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git -C "$DEPLOY_PATH" rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync the deployment to that commit
        env:
          # Job-scoped token (contents:read). Passed to git through an inline
          # askpass rather than written into the remote URL, so nothing is
          # persisted in the deployment's .git/config.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd "$DEPLOY_PATH"
          # The tracked tree is reset; .env is untracked and survives.
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            fetch --prune origin main
          git reset --hard "${{ steps.target.outputs.sha }}"
          echo "deploying $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the images CI published for this commit
        run: |
          set -eu
          cd "$DEPLOY_PATH"
          SHA="${{ steps.target.outputs.sha }}"
          # Both images are tagged by release.yml with the full commit SHA. Export
          # them so compose references the exact migration and app images for this
          # release instead of an older 'latest'.
          # Export for THIS step as well as GITHUB_ENV for later steps — values
          # written to GITHUB_ENV are only visible to subsequent steps.
          export APP_IMAGE="ghcr.io/${{ github.repository }}:${SHA}"
          export MIGRATE_IMAGE="ghcr.io/${{ github.repository }}:migrate-${SHA}"
          echo "APP_IMAGE=${APP_IMAGE}" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=${MIGRATE_IMAGE}" >> "$GITHUB_ENV"

          # Release runs in parallel with CI, so its tags may not exist yet when
          # this job starts. Wait for them instead of racing the publisher.
          for i in $(seq 1 30); do
            if docker manifest inspect "$APP_IMAGE" >/dev/null 2>&1 &&
               docker manifest inspect "$MIGRATE_IMAGE" >/dev/null 2>&1; then
              echo "images available after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::tags for ${SHA} never appeared — check/re-run the Release image workflow"
              exit 1
            fi
            sleep 10
          done
          docker compose pull

      - name: Restart on the published images
        run: |
          set -eu
          cd "$DEPLOY_PATH"
          # No build here: --no-build guarantees a registry failure can never turn
          # into a half-built local image or a wedged buildkit session.
          docker compose up -d --no-build

      - name: Wait for health
        run: |
          set -eu
          cd "$DEPLOY_PATH"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 "https://$PUBLIC_HOST/api/health" >/dev/null 2>&1; then
              echo "healthy after ${i} attempts"
              curl -fsS --max-time 5 "https://$PUBLIC_HOST/api/health"
              echo
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "::error::health check never came back on https://$PUBLIC_HOST"
          docker compose ps
          docker compose logs --tail=80 app || true
          exit 1

      - name: Report the running revision
        run: |
          cd "$DEPLOY_PATH"
          echo "commit: $(git rev-parse HEAD)"
          docker compose ps --format '{{.Service}} {{.Status}}'
