# Run on the server with:  docker compose up -d --build
# Settings come from a .env file beside this one (see deploy.example.env).

name: eavi-portal

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # The image defaults leave shared_buffers at 128MB on a machine with 11GB RAM, and
    # without query timing there is no way to diagnose a slow request after the fact.
    # pg_stat_statements is created by a migration; the library must be loaded at boot.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=8MB
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 wants the mount one level up: it keeps its data in a
      # version-specific subdirectory, which is what makes pg_upgrade --link possible.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The queue broker. AOF is on so a queued card batch survives a Redis restart: the
  # batch row would otherwise sit pending forever with its job gone.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Applies pending migrations and exits; the app only starts once it succeeded.
  migrate:
    build:
      context: .
      target: migrate
    image: ${MIGRATE_IMAGE:-eavi-portal-migrate:latest}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
      args:
        # The public origin, baked into metadata, JSON-LD, sitemap and robots.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        # The push public key, inlined into the client bundle at build time.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        # Build-time CSP: the object store's origin must be allowed in img-src or the
        # browser refuses every profile and student photo.
        S3_ENDPOINT: ${S3_ENDPOINT:-}
    image: ${APP_IMAGE:-eavi-portal:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      # Web push (VAPID). Declared with :- so a server without keys still starts; the
      # bell then works in-app only, and the first push attempt says what is missing.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # The public origin at runtime: sign-in redirects must end at the site the browser
      # actually used, never the container's own localhost behind the proxy.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      REDIS_URL: redis://redis:6379
      # The origin is loopback-only; Caddy is the sole proxy and overwrites forwarding data.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      # Object storage (Contabo S3-compatible). Declared with :- so a server
      # without these in .env still starts instead of failing interpolation.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ACCOUNT_ID: ${S3_ACCOUNT_ID:-}
      # "Sign in with Google". Empty means the button refuses politely; the password
      # form is unaffected. See docs/GOOGLE-OAUTH.md.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Application-letter delivery. Both are best effort after the letter is committed.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      OPENWA_API_URL: http://openwa:2785
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_SESSION_NAME: ${OPENWA_SESSION_NAME:-eavi-admissions}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      openwa:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # WhatsApp delivery for application letters. One API process, one linked session, no
  # separate dashboard: pairing is driven from EAVI's super-admin screen. The container
  # listens on 2785 and is published on its own host port so other OpenWA stacks are untouched.
  openwa:
    image: rmyndharis/openwa:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 2785
      SERVE_DASHBOARD: "false"
      API_MASTER_KEY: ${OPENWA_API_KEY:?set OPENWA_API_KEY in .env}
      ENGINE_TYPE: ${OPENWA_ENGINE_TYPE:-whatsapp-web.js}
      AUTO_START_SESSIONS: "true"
      CORS_ORIGINS: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - openwa-data:/app/data
    ports:
      - "127.0.0.1:${OPENWA_PORT:-2786}:2785"
    stop_grace_period: 90s

  # Consumes the queues: card batch PDFs and the chat attachment sweep. The same image as
  # the app, a different entry point. It must exist in production — without it, queued card
  # runs sit pending forever. Scale by adding replicas of this one service.
  worker:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        S3_ENDPOINT: ${S3_ENDPOINT:-}
    image: ${APP_IMAGE:-eavi-portal:latest}
    restart: unless-stopped
    command: ["node", "worker.mjs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      # Card batches upload the finished PDF, so storage is the worker's too.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ACCOUNT_ID: ${S3_ACCOUNT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
  openwa-data:
